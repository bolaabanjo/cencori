<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cencori Web</title>
  <desc id="desc">A dark editorial diagram of a search query moving through Cencori Web into ranked evidence.</desc>
  <rect width="1600" height="900" fill="#070908"/>
  <g fill="none" stroke="#28302b" stroke-width="2">
    <path d="M0 170h1600M0 450h1600M0 730h1600"/>
    <path d="M210 0v900M800 0v900M1390 0v900"/>
  </g>
  <circle cx="800" cy="450" r="234" fill="#0d120f" stroke="#92f7b1" stroke-width="3"/>
  <circle cx="800" cy="450" r="178" fill="none" stroke="#334239" stroke-width="2"/>
  <path d="M578 390h444M578 510h444M800 216c-80 76-120 154-120 234s40 158 120 234M800 216c80 76 120 154 120 234s-40 158-120 234" fill="none" stroke="#92f7b1" stroke-width="3"/>
  <g fill="#92f7b1">
    <circle cx="800" cy="216" r="8"/><circle cx="578" cy="390" r="8"/><circle cx="1022" cy="510" r="8"/><circle cx="800" cy="684" r="8"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e8eee9">
    <text x="96" y="100" font-size="24" letter-spacing="4">CENCORI / WEB</text>
    <text x="96" y="815" font-size="18" fill="#8b9990">SEARCH  ·  FETCH  ·  EXTRACT  ·  CRAWL  ·  BROWSE  ·  EVIDENCE</text>
    <text x="1130" y="110" font-size="18" fill="#92f7b1">FIRST-PARTY</text>
    <text x="1128" y="145" font-size="18" fill="#8b9990">WEB INTELLIGENCE</text>
  </g>
  <text x="800" y="466" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="70" font-weight="700" fill="#f4f7f4">WEB</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
    <rect x="70" y="260" width="340" height="128" rx="4" fill="#101512" stroke="#334239"/>
    <text x="98" y="306" fill="#8b9990">QUERY</text><text x="98" y="350" fill="#e8eee9">latest release notes</text>
    <rect x="1190" y="500" width="340" height="166" rx="4" fill="#101512" stroke="#334239"/>
    <text x="1218" y="546" fill="#8b9990">EVIDENCE</text><text x="1218" y="590" fill="#e8eee9">quote + URL</text><text x="1218" y="622" fill="#e8eee9">hash + retrievedAt</text>
  </g>
</svg>
